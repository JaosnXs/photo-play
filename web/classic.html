<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PhotoPlay - 扫照片 播视频</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 顶部栏 -->
  <header class="topbar">
    <span class="title">PhotoPlay <small class="ver">v4</small></span>
    <span class="status-dot" id="status-dot" title="服务状态"></span>
  </header>

  <main class="stage">
    <!-- AR 取景态：全画面自动识别，视频透视叠加在照片上 -->
    <section id="camera-view" class="view active">
      <video id="camera" autoplay playsinline muted></video>
      <div id="debug-quad"></div>
      <video id="ar-video" playsinline></video>
      <button id="sound-btn" aria-label="开启声音">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4zm14.6 3 2.2-2.2-1.4-1.4-2.2 2.2-2.2-2.2-1.4 1.4 2.2 2.2-2.2 2.2 1.4 1.4 2.2-2.2 2.2 2.2 1.4-1.4-2.2-2.2z"/></svg>
      </button>
      <div id="scan-hint">对准照片，自动识别</div>
      <div id="fallback-tip">
        <p>无法访问摄像头</p>
        <p>请确认已授权摄像头权限，且页面通过 HTTPS 或 localhost 访问</p>
        <button class="primary-btn" onclick="initCamera()">重试</button>
      </div>
    </section>
  </main>
</div>

<script>
const cameraEl = document.getElementById('camera');
const arVideo = document.getElementById('ar-video');
const debugQuad = document.getElementById('debug-quad');
const soundBtn = document.getElementById('sound-btn');
const scanHint = document.getElementById('scan-hint');
const statusDot = document.getElementById('status-dot');
let stream = null;

/* ---------------- 服务状态 ---------------- */
async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    statusDot.classList.toggle('on', d.status === 'ok');
    statusDot.title = `特征库: ${d.library_size} 张`;
  } catch {
    statusDot.classList.remove('on');
  }
}

/* ---------------- 摄像头 ---------------- */
async function initCamera() {
  document.getElementById('fallback-tip').style.display = 'none';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    cameraEl.srcObject = stream;
  } catch (e) {
    document.getElementById('fallback-tip').style.display = 'flex';
  }
}

/* ---------------- 3x3 矩阵工具（行优先） ---------------- */
function mul3(A, B) {
  const C = new Array(9).fill(0);
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++)
      for (let k = 0; k < 3; k++)
        C[i * 3 + j] += A[i * 3 + k] * B[k * 3 + j];
  return C;
}

/* ---------------- AR 追踪状态 ---------------- */
const DETECT_INTERVAL = 350;   // 识别轮询间隔 (ms)
const MAX_MISS = 4;            // 连续丢失多少帧后隐藏视频
const SMOOTH_ALPHA = 0.35;     // 矩阵平滑系数（越大越灵敏，越小越稳）

let inFlight = false;
let tracking = false;
let missCount = 0;
let smoothM = null;            // 平滑后的 3x3 矩阵（行优先）
let currentPhotoId = null;

function isValid3(M) {
  return Array.isArray(M) && M.length === 9 &&
         M.every(v => typeof v === 'number' && isFinite(v)) && Math.abs(M[8]) > 1e-12;
}

// 摄像头视频流 -> 屏幕 CSS 像素 的映射参数（object-fit: cover）
function screenMapping(capW, capH) {
  const vw = cameraEl.videoWidth, vh = cameraEl.videoHeight;
  const rect = cameraEl.getBoundingClientRect();
  if (!vw || !vh || !rect.width || !rect.height) return null;
  const dispScale = Math.max(rect.width / vw, rect.height / vh);
  const offX = rect.left + (rect.width - vw * dispScale) / 2;
  const offY = rect.top + (rect.height - vh * dispScale) / 2;
  const k = dispScale / (capW / vw); // 采集图可能缩放过
  if (!isFinite(k) || k <= 0) return null;
  return [k, 0, offX, 0, k, offY, 0, 0, 1];
}

function applyMatrix(M) {
  // M 为行优先 3x3；CSS matrix3d 按列优先填充：
  // col1=(M0,M3,0,M6) col2=(M1,M4,0,M7) col3=(0,0,1,0) col4=(M2,M5,0,M8)
  const css =
    `matrix3d(${M[0]},${M[3]},0,${M[6]},${M[1]},${M[4]},0,${M[7]},0,0,1,0,${M[2]},${M[5]},0,${M[8]})`;
  arVideo.style.transform = css;
  debugQuad.style.transform = css;
}

function updateTransform(H, capW, capH) {
  if (!isValid3(H)) { scanHint.textContent = '矩阵数据异常'; return; }
  const S = screenMapping(capW, capH);
  if (!S) return;
  // 用 startOverlay 缓存的元素尺寸（= 视频固有分辨率），避免时机问题
  const vw = arVideo._elemW || 1280;
  const vh = arVideo._elemH || 720;
  // 视频像素 -> [0,1] 归一化（H 接受的是归一化注册图坐标）
  const Dv = [1 / vw, 0, 0, 0, 1 / vh, 0, 0, 0, 1];
  let M = mul3(S, mul3(H, Dv));
  if (Math.abs(M[8]) > 1e-12) M = M.map(v => v / M[8]);
  if (!isValid3(M)) { scanHint.textContent = '矩阵计算异常'; return; }

  if (smoothM) {
    // 符号对齐，避免矩阵整体取反导致插值发散
    let dot = 0;
    for (let i = 0; i < 9; i++) dot += M[i] * smoothM[i];
    const sign = dot < 0 ? -1 : 1;
    smoothM = smoothM.map((v, i) => v * (1 - SMOOTH_ALPHA) + sign * M[i] * SMOOTH_ALPHA);
  } else {
    smoothM = M;
  }
  applyMatrix(smoothM);
}

async function startOverlay(data) {
  currentPhotoId = data.photo_id;
  arVideo._libSize = data.lib_size;
  if (arVideo.dataset.photoId !== data.photo_id) {
    arVideo.dataset.photoId = data.photo_id;
    arVideo.src = data.video_url;
    await new Promise(resolve => {
      if (arVideo.readyState >= 1) return resolve();
      arVideo.addEventListener('loadedmetadata', resolve, { once: true });
    });
    // 显式固定元素尺寸为视频固有分辨率，矩阵变换以此为基准。
    // 个别浏览器 loadedmetadata 后 videoWidth 仍为 0，用注册图尺寸兜底
    const vw = arVideo.videoWidth || (data.lib_size ? data.lib_size[0] : 1280);
    const vh = arVideo.videoHeight || (data.lib_size ? data.lib_size[1] : 720);
    arVideo._elemW = vw;
    arVideo._elemH = vh;
    arVideo.style.width = vw + 'px';
    arVideo.style.height = vh + 'px';
    debugQuad.style.width = vw + 'px';
    debugQuad.style.height = vh + 'px';
  }
  debugQuad.classList.add('show');
  arVideo.currentTime = 0;
  // 有声自动播放被拦截时退化为静音 + 声音按钮
  arVideo.muted = false;
  try {
    await arVideo.play();
    soundBtn.classList.remove('show');
  } catch {
    arVideo.muted = true;
    arVideo.play().catch(() => {});
    soundBtn.classList.add('show');
  }
  arVideo.classList.add('show');
  tracking = true;
  scanHint.textContent = data.title || '已识别';
  scanHint.classList.add('locked');
}

function hideOverlay() {
  tracking = false;
  smoothM = null;
  currentPhotoId = null;
  missCount = 0;
  arVideo.classList.remove('show');
  arVideo.pause();
  debugQuad.classList.remove('show');
  soundBtn.classList.remove('show');
  scanHint.textContent = '对准照片，自动识别';
  scanHint.classList.remove('locked');
}

soundBtn.addEventListener('click', () => {
  arVideo.muted = false;
  soundBtn.classList.remove('show');
});

arVideo.addEventListener('ended', hideOverlay);

/* ---------------- 识别循环 ---------------- */
function captureFrame() {
  const vw = cameraEl.videoWidth, vh = cameraEl.videoHeight;
  if (!vw || !vh) return null;
  const scale = Math.min(1, 960 / vw);  // 检测帧限宽 960，平衡速度与精度
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(vw * scale);
  canvas.height = Math.round(vh * scale);
  canvas.getContext('2d').drawImage(cameraEl, 0, 0, canvas.width, canvas.height);
  return canvas;
}

async function detectOnce() {
  if (inFlight || document.hidden) return;
  const canvas = captureFrame();
  if (!canvas) return;
  inFlight = true;
  try {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
    const fd = new FormData();
    fd.append('file', blob, 'frame.jpg');
    const resp = await fetch('/api/match', { method: 'POST', body: fd });
    const data = await resp.json();
    if (data.matched && data.homography) {
      missCount = 0;
      if (!tracking || currentPhotoId !== data.photo_id) {
        await startOverlay(data);
      }
      updateTransform(data.homography, canvas.width, canvas.height);
    } else if (tracking) {
      missCount++;
      if (missCount >= MAX_MISS) hideOverlay();
    }
  } catch {
    // 网络抖动：按丢失计，交给丢失阈值兜底
    if (tracking) {
      missCount++;
      if (missCount >= MAX_MISS) hideOverlay();
    }
  } finally {
    inFlight = false;
  }
}

checkHealth();
setInterval(checkHealth, 10000);
initCamera();
setInterval(detectOnce, DETECT_INTERVAL);
</script>
</body>
</html>
